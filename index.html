<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cards Against Our Ulibarri Family</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ulibarri Cards">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#111; --panel:#1d1d1f; --line:#333; --muted:#9a9aa0; --gold:#ffcc33; --pink:#ff5d8f; --green:#3ddc84;
  --sans: "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font-family:var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 110px)}
button{font-family:inherit}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:40px}
.bar .meta{font-size:13px;color:var(--muted)}
.bar .meta b{color:#fff;letter-spacing:.12em}
.iconbtn{background:#222;border:0;color:#fff;width:42px;height:42px;border-radius:12px;font-size:20px;cursor:pointer}
.logo{margin:34px 0 8px;display:flex;justify-content:center;gap:0}
.logo .c{width:128px;height:168px;border-radius:14px;padding:14px;font-weight:800;font-size:21px;line-height:1.08;letter-spacing:-.01em;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.logo .c.k{background:#000;color:#fff;border:2px solid #333;transform:rotate(-7deg) translateX(14px)}
.logo .c.w{background:#fff;color:#000;transform:rotate(6deg) translate(-14px,14px)}
.tag{text-align:center;color:var(--muted);margin:30px 0 26px;font-size:15px}
h1{font-size:28px;margin:6px 0 6px;letter-spacing:-.02em;line-height:1.1}
h2{font-size:19px;margin:24px 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px;line-height:1.4}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:17px 18px;font-size:18px;font-weight:800;cursor:pointer;background:#fff;color:#000;margin:10px 0}
.btn.gold{background:var(--gold)}
.btn.pink{background:var(--pink);color:#fff}
.btn.ghost{background:#222;color:#fff;font-weight:600}
.btn.small{padding:12px 14px;font-size:15px}
.btn:disabled{opacity:.35}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;cursor:pointer;padding:10px;display:block;margin:4px auto}
.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
input[type=text],textarea{width:100%;font:inherit;font-size:18px;border:2px solid #333;border-radius:12px;padding:14px;background:#1a1a1a;color:#fff;outline:none}
input[type=text]:focus,textarea:focus{border-color:#fff}
textarea{min-height:110px;font-weight:700}

/* cards */
.black{background:#000;color:#fff;border:2px solid #2e2e2e;border-radius:16px;padding:18px 18px 34px;font-size:23px;font-weight:800;line-height:1.25;position:relative;letter-spacing:-.01em}
.black .pk{position:absolute;right:14px;bottom:10px;font-size:12px;font-weight:800;color:#000;background:#fff;border-radius:20px;padding:3px 9px}
.black .src{position:absolute;left:18px;bottom:11px;font-size:11px;color:#777;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.black .fill{color:var(--gold);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.black .ans{display:block;margin-top:12px;color:var(--gold)}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid #fff;transform:translateY(-4px)}
.hand{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.wc{background:#fff;color:#000;border:0;border-radius:14px;padding:14px 12px 30px;min-height:122px;text-align:left;font-size:17px;font-weight:800;line-height:1.2;position:relative;cursor:pointer;letter-spacing:-.01em;transition:transform .08s}
.wc:active{transform:scale(.97)}
.wc.sel{outline:4px solid var(--gold);outline-offset:-4px;background:#fff8dc}
.wc.no{opacity:.32}
.wc .num{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#000;font-size:15px;display:flex;align-items:center;justify-content:center}
.wc .note{position:absolute;left:12px;bottom:9px;font-size:11px;font-weight:700;color:#888}
.wc.blk{background:repeating-linear-gradient(135deg,#fff,#fff 10px,#f3f3f3 10px,#f3f3f3 20px);color:#555}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,rgba(17,17,17,.96) 26%);z-index:5}
.sticky .in{max-width:560px;margin:0 auto}
.sticky .btn{margin:0}
.combo{background:#fff;color:#000;border-radius:16px;padding:16px;margin:10px 0;font-weight:800;font-size:19px;line-height:1.3;cursor:pointer;border:0;width:100%;text-align:left;position:relative}
.combo .fill{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;background:#fff3b0}
.combo.sel{outline:5px solid var(--gold);outline-offset:-5px}
.combo.mine{box-shadow:inset 0 0 0 3px #bbb}
.combo .who{display:block;font-size:13px;color:#666;margin-top:8px;font-weight:700}
.combo.win{background:var(--gold)}
.combo.win .fill{background:#fff6}
.status{background:#1d1d1f;border-radius:14px;padding:14px;margin:12px 0;font-size:15px;line-height:1.45}
.status b{color:var(--gold)}
.pill{display:inline-block;background:#262628;border-radius:20px;padding:6px 11px;margin:3px 4px 3px 0;font-size:14px}
.pill.done{background:#1f3b2a;color:var(--green)}
.pill.off{opacity:.45}
.list .row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid #262628;font-size:17px}
.list .row .sc{font-weight:800;font-size:20px}
.list .row .x{background:#2a1a1f;color:#ff8da8;border:0;border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#1d1d1f;border-radius:12px;margin:8px 0;cursor:pointer;border:0;width:100%;color:#fff;text-align:left;font-size:16px}
.toggle small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sw{width:50px;height:30px;border-radius:15px;background:#444;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--green)}.sw.on::after{left:23px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#1d1d1f;border-radius:12px;padding:8px 8px 8px 14px}
.stepper button{width:44px;height:44px;border-radius:10px;border:0;background:#333;color:#fff;font-size:22px;font-weight:800}
.stepper b{font-size:22px;margin:0 14px}
.code{font-size:56px;font-weight:900;letter-spacing:.18em;text-align:center;margin:4px 0}
.center{text-align:center}
.big-emoji{font-size:64px;text-align:center;margin:30px 0 6px}
.banner{background:var(--gold);color:#000;border-radius:14px;padding:12px 14px;font-weight:800;margin:10px 0;font-size:16px}
.err{background:#3a1520;color:#ffb3c4;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#1b1b1d;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto}
.hist{font-size:14px;color:#ccc;padding:10px 0;border-bottom:1px solid #262628;line-height:1.4}
.hist b{color:#fff}
.ver{color:#555;font-size:12px;text-align:center;margin-top:26px}
.howto p{line-height:1.5;color:#ddd;font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<script src="peerjs.min.js"></script>
<script src="cards.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
